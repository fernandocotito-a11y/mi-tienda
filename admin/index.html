<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrar contenido</title>
</head>
<body>
  <a href="https://mitienda-express.com" target="_blank" rel="noopener" title="Ver la tienda"
     style="position: fixed; top: 14px; right: 16px; z-index: 99999; display: inline-flex; align-items: center; gap: 6px; background: #10b8e2; color: #fff; padding: 9px 16px; border-radius: 24px; text-decoration: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.22); transition: transform .15s, box-shadow .15s;"
     onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 20px rgba(0,0,0,0.28)'"
     onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 14px rgba(0,0,0,0.22)'">
    🌐 Ver tienda ↗
  </a>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    (function () {
      function restrict(el) {
        var a = el.getAttribute("accept") || "";
        if (a.indexOf("image") !== -1) {
          el.setAttribute("accept", ".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp");
        }
      }
      new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          (m.addedNodes || []).forEach(function (n) {
            if (n.nodeType !== 1) return;
            if (n.tagName === "INPUT" && n.type === "file") restrict(n);
            if (n.querySelectorAll) n.querySelectorAll("input[type=file]").forEach(restrict);
          });
        });
      }).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
